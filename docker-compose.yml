version: "3.8"

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: codeclash-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: codeclash

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeclash-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/codeclash
      JWT_SECRET: ${JWT_SECRET:-codeclash_dev_secret_change_in_production}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-CodeClash_Secret_99}
      FRONTEND_URL: http://localhost:5173

  # Compiler / Code Execution Service
  compiler:
    build:
      context: ./compiler
      dockerfile: Dockerfile
    container_name: codeclash-compiler
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      FRONTEND_URL: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

  # Frontend (dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeclash-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:5000
      VITE_COMPILER_URL: http://localhost:8000

volumes:
  mongo_data:
